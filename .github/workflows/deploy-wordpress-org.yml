name: Deploy to WordPress.org
on:
  push:
    tags:
      - '*'
permissions:
  contents: read
concurrency:
  group: wordpress-org-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify stable release tag and manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: python3 scripts/authorize-release.py
  deploy:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Prepare validated production files without an archive
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          python3 tests/distribution.py
          python3 scripts/build-dist.py --stage /tmp/acafs-wordpress-publish/ac-advanced-flamingo-settings
      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SLUG: ac-advanced-flamingo-settings
          VERSION: ${{ github.ref_name }}
          BUILD_DIR: /tmp/acafs-wordpress-publish/ac-advanced-flamingo-settings
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
# Publication is automatic for valid stable release tags, never branch pushes.
